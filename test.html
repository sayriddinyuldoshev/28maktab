let questions=[], index=0, correct=0, chosen=false;
const $=id=>document.getElementById(id);

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function start(){
  let key=$("subject").value;
  questions=shuffle([...facts[key]]).slice(0,20);
  index=0; correct=0;
  $("setup").hidden=true;
  $("result").hidden=true;
  $("quiz").hidden=false;
  show();
}
function show(){
  chosen=false;
  let q=questions[index];
  $("progress").textContent=`Savol ${index+1}/20`;
  $("score").textContent=`To‘g‘ri: ${correct}`;
  $("bar").style.width=(index/20*100)+"%";
  $("question").textContent=q[0];
  $("answers").innerHTML="";
  $("next").disabled=true;
  $("next").textContent=index===19?"Natijani ko‘rish":"Keyingi savol →";
  shuffle([q[1],...q[2]]).forEach(answer=>{
    let b=document.createElement("button");
    b.textContent=answer;
    b.onclick=()=>{
      if(chosen)return;
      chosen=true;
      const buttons=[...$("answers").children];
      buttons.forEach(x=>{
        x.disabled=true;
        if(x.textContent===q[1])x.classList.add("correct");
      });
      if(answer===q[1]){
        correct++;
        b.classList.add("correct");
      } else b.classList.add("wrong");
      $("score").textContent=`To‘g‘ri: ${correct}`;
      $("next").disabled=false;
    };
    $("answers").appendChild(b);
  });
}
function nextQuestion(){
  if(index<19){index++;show();return;}
  $("quiz").hidden=true;
  $("result").hidden=false;
  let percent=Math.round(correct/20*100);
  $("finalscore").textContent=`${correct}/20 — ${percent}%`;
  $("message").textContent=percent>=90?"A’lo natija!":percent>=70?"Yaxshi natija!":percent>=50?"Yana mashq qiling!":"Mavzularni takrorlab, qayta urinib ko‘ring.";
}
function back(){
  $("result").hidden=true;
  $("setup").hidden=false;
}
