<style>

<style id="UZBEK-MILLIY-DIZAYN">
:root {
  --milliy-yashil: #075e54;
  --milliy-turkuaz: #087f70;
  --milliy-oltin: #d9ad55;
  --milliy-oq: #fffaf0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--milliy-oq);
  background-image:
    radial-gradient(circle at 12px 12px,
      rgba(217,173,85,.12) 2px, transparent 3px);
  background-size: 28px 28px;
  color: #193b35;
  font-family: Arial, sans-serif;
  line-height: 1.6;
}
header, nav, .header, .navbar {
  background-color: var(--milliy-yashil);
  color: white;
}
h1, h2, h3 {
  color: var(--milliy-yashil);
}
header h1, header h2, nav h1, nav h2 {
  color: white;
}
a {
  color: var(--milliy-turkuaz);
}
button, input[type="button"], input[type="submit"],
.btn, .button {
  background: var(--milliy-yashil);
  color: white;
  border: 1px solid var(--milliy-oltin);
  border-radius: 9px;
  padding: 10px 16px;
  cursor: pointer;
}
button:hover, input[type="button"]:hover,
input[type="submit"]:hover, .btn:hover {
  background: var(--milliy-turkuaz);
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border: 2px solid var(--milliy-oltin);
  border-radius: 10px;
}
th {
  background: var(--milliy-yashil);
  color: white;
  padding: 12px 8px;
}
td {
  padding: 10px 8px;
  border: 1px solid #e6d8b9;
  text-align: center;
}
tr:nth-child(even) td {
  background: #f5f0e3;
}
input, select, textarea {
  max-width: 100%;
  padding: 10px;
  border: 1px solid #c9b989;
  border-radius: 8px;
  font: inherit;
}
img { max-width: 100%; height: auto; }
main, section, .container {
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
}
footer {
  background: var(--milliy-yashil);
  color: white;
  border-top: 4px solid var(--milliy-oltin);
  padding: 20px;
  text-align: center;
}
@media (max-width: 600px) {
  body { font-size: 14px; }
  table { font-size: 12px; }
  th, td { padding: 7px 5px; }
  main, section, .container { width: 100%; padding: 10px; }
}
</style>


<style id="maktab-common-menu-style">
.maktab-menu{
  background:#075e45;color:white;padding:12px;
  display:flex;flex-wrap:wrap;gap:9px;
  align-items:center;justify-content:center;
  font-family:Arial,sans-serif;position:relative;z-index:10

<body>

<header>
<h1>🏫 28-maktab</h1>
<p>Dars jadvali — rasm orqali</p>
</header>
<main>
<div class="card">
<h2>📷 Jadvalni kiritish</h2>
<label for="sinf">Sinf nomi</label>
<input id="sinf" placeholder="Masalan: 8-B">
<label for="rasm">Jadval rasmini tanlang</label>
<input id="rasm" type="file" accept="image/*">
<button id="save">Jadvalni saqlash</button>
<small>Rasm shu qurilmadagi brauzer xotirasida saqlanadi. Katta rasm tanlasangiz, xotira chegarasiga yetishi mumkin.</small>
</div>
<div class="card">
<h2>📚 Saqlangan jadvallar</h2>
<div id="list"></div>
</div>
<p><a href="index.html">← Bosh sahifaga qaytish</a></p>
</main>
<script>
const key="maktab28_jadvallar";
let selected="";
const file=document.getElementById("rasm");
file.addEventListener("change",()=>{
 const f=file.files[0];
 if(!f)return;
 if(!f.type.startsWith("image/")){
 alert("Rasm faylini tanlang.");return;
 }
 if(f.size>3*1024*1024){
 alert("Rasm 3 MB dan kichik bo‘lsin.");file.value="";return;
 }
 const reader=new FileReader();
 reader.onload=()=>{selected=reader.result;};
 reader.readAsDataURL(f);
});
function getItems(){
 try{return JSON.parse(localStorage.getItem(key)||"[]")}
 catch(e){return []}
}
function show(){
 const items=getItems();
 document.getElementById("list").innerHTML="";
 if(!items.length){
 document.getElementById("list").textContent="Hali jadval kiritilmagan.";
 return;
 }
 items.forEach((x,i)=>{
 const box=document.createElement("div");
 box.style.marginBottom="22px";
 const title=document.createElement("h3");
 title.textContent=x.sinf;
 const image=document.createElement("img");
 image.src=x.rasm;image.alt=x.sinf+" dars jadvali";
 const del=document.createElement("button");
 del.className="remove";del.textContent="O‘chirish";
 del.onclick=()=>{
 if(confirm(x.sinf+" jadvali o‘chirilsinmi?")){
 const a=getItems();a.splice(i,1);
 localStorage.setItem(key,JSON.stringify(a));show();
 }
 };
 box.append(title,image,del);
 document.getElementById("list").appendChild(box);
 });
}
document.getElementById("save").onclick=()=>{
 const sinf=document.getElementById("sinf").value.trim();
 if(!sinf||!selected){alert("Sinf nomi va rasmni tanlang.");return;}
 const items=getItems();
 items.unshift({sinf,rasm:selected});
 try{
 localStorage.setItem(key,JSON.stringify(items));
 }catch(e){
 alert("Brauzer xotirasi yetarli emas. Kichikroq rasm tanlang.");
 return;
 }
 document.getElementById("sinf").value="";
 document.getElementById("rasm").value="";
 selected="";
 show();
 alert("Jadval ushbu qurilmada saqlandi!");
};
show();
</script>
</body>
</html>
